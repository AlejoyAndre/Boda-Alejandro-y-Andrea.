<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda Andrea y Alejandro</title>
    <style>
        /* Estilos Generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #113322;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Pantalla de Bienvenida (Intro Overlay) con la portada original */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b2216;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease, visibility 1s;
        }
        #intro-overlay img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
        }
        .click-to-enter {
            position: absolute;
            bottom: 8%;
            background: rgba(255, 255, 255, 0.95);
            color: #113322;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Contenedor Principal */
        .invitation-container {
            width: 100%;
            max-width: 500px;
            position: relative;
            background: #fffdf9;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        .card-section {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .card-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Sección del Botón de YouTube / Single */
        .youtube-section {
            background: #fffdf9;
            padding: 25px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px solid #eee;
        }
        .youtube-title {
            font-size: 1rem;
            color: #113322;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-youtube {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #ff0000;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            width: 80%;
            max-width: 280px;
            margin-bottom: 15px;
        }
        .btn-youtube:hover {
            background-color: #cc0000;
            transform: scale(1.03);
        }
        .btn-youtube svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Estilos para el aviso de Spotify */
        .spotify-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #444;
            text-align: left;
            padding: 0 10px;
        }
        .spotify-notice svg {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            fill: #1DB954;
        }

        /* Contador Regresivo */
        .countdown-container {
            background: #fffdf9;
            padding: 30px 10px;
            text-align: center;
            color: #bc964a;
        }
        .countdown-title {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #113322;
            font-weight: 600;
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .time-block {
            background: #113322;
            color: #fffdf9;
            padding: 12px 10px;
            border-radius: 8px;
            min-width: 72px;
            border: 1px solid #bc964a;
        }
        .time-block span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .time-block label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* Capas Interactivas Invisibles (Links sobre botones) */
        .btn-overlay {
            position: absolute;
            z-index: 10;
            text-decoration: none;
            cursor: pointer;
        }

        /* Botón Waze */
        .btn-location-waze {
            bottom: 3.2%;
            left: 23%;
            width: 27%;
            height: 5.5%;
            border-top-left-radius: 15px;
            border-bottom-left-radius: 15px;
        }

        /* Botón Maps */
        .btn-location-maps {
            bottom: 3.2%;
            left: 50%;
            width: 27%;
            height: 5.5%;
            border-top-right-radius: 15px;
            border-bottom-right-radius: 15px;
        }

        /* Botón Confirmar Asistencia */
        .btn-rsvp {
            bottom: 12.8%;
            left: 20%;
            width: 60%;
            height: 6.2%;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla de Bienvenida con la portada original -->
    <div id="intro-overlay" onclick="startInvitacion()">
        <img src="portada.png" onerror="this.src='portada.PNG'" alt="Portada Invitación">
        <div class="click-to-enter">Toca para abrir la invitación 🎵</div>
    </div>

    <div class="invitation-container">

        <!-- Portada dentro de la página -->
        <div class="card-section">
            <img src="portada.png" onerror="this.src='portada.PNG'" alt="Portada">
        </div>

        <!-- Imagen de la Canción / Single (PORTADA SINGLE.jpg) -->
        <div class="card-section">
            <img src="PORTADA SINGLE.jpg" onerror="this.src='portada.png'" alt="Portada Single">
        </div>

        <!-- Sección de YouTube con botón elegante y aviso de Spotify -->
        <div class="youtube-section">
            <div class="youtube-title">Escucha nuestra canción</div>
            <a href="https://youtu.be/QUMn2W194l4" target="_blank" class="btn-youtube">
                <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                Ver en YouTube
            </a>

            <!-- Aviso de Próximamente en Spotify con logo -->
            <div class="spotify-notice">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.599-.12-.42.18-.78.6-.9 4.56-1.02 8.52-.6 11.76 1.44.36.24.48.72.221 1.06zm1.44-3.9c-.301.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.41-.48.18-1.02-.06-1.2-.54-.18-.48.06-1.02.54-1.2 4.2-1.26 9.6-.6 13.44 1.8.42.24.6.78.42 1.25zm.12-4.08C14.4 7.32 8.34 7.14 4.86 8.16c-.54.18-1.14-.12-1.32-.66-.18-.54.12-1.14.66-1.32 4.08-1.26 10.8-1.08 14.76 1.32.54.36.72 1.08.36 1.62-.36.54-1.08.72-1.62.36z"/>
                </svg>
                <span>Próximamente podrás disfrutar de nuestra canción en Spotify, Apple Music y todas las plataformas digitales.</span>
            </div>
        </div>

        <div class="card-section">
            <img src="fecha.png" onerror="this.src='fecha.PNG'" alt="Fecha y Lugar">
        </div>

        <div class="countdown-container">
            <div class="countdown-title">Faltan muy pocos días</div>
            <div class="countdown">
                <div class="time-block"><span id="days">00</span><label>Días</label></div>
                <div class="time-block"><span id="hours">00</span><label>Horas</label></div>
                <div class="time-block"><span id="minutes">00</span><label>Min</label></div>
                <div class="time-block"><span id="seconds">00</span><label>Seg</label></div>
            </div>
        </div>

        <div class="card-section">
            <img src="happy toguether.png" onerror="this.src='happy toguether.PNG'" alt="Happy Together">
            
            <a href="https://ul.waze.com/ul?venue_id=187301936.1872888291.12610359&overview=yes&utm_campaign=default&utm_source=waze_website&utm_medium=lm_share_location" target="_blank" class="btn-overlay btn-location-waze" title="Ir con Waze"></a>
            
            <a href="https://www.google.com/maps/search/?api=1&query=Hacienda+Absalon" target="_blank" class="btn-overlay btn-location-maps" title="Ir con Google Maps"></a>
        </div>

        <div class="card-section">
            <img src="codigo.png" onerror="this.src='codigo.PNG'" alt="Código de Vestimenta">
        </div>

        <div class="card-section">
            <img src="lluvia de sobres.png" onerror="this.src='lluvia de sobres.PNG'" alt="Lluvia de sobres">
            
            <a href="https://forms.google.com/TU_LINK_DE_FORMS_AQUI" target="_blank" class="btn-overlay btn-rsvp" title="Confirmar Asistencia"></a>
        </div>

    </div>

    <script>
        function startInvitacion() {
            const overlay = document.getElementById('intro-overlay');
            const music = document.getElementById('bg-music');
            
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.visibility = 'hidden';
            }, 1000);
            
            music.play().catch(error => {
                console.log("Audio play prevenido:", error);
            });
        }

        // Cuenta regresiva: 25 de Septiembre de 2026, 3:00 PM (15:00)
        const weddingDate = new Date("Sep 25, 2026 15:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-container").innerHTML = "<div class='countdown-title' style='font-weight:bold;'>¡Llegó el gran día! 🥂</div>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }, 1000);
    </script>
</body>
</html>
